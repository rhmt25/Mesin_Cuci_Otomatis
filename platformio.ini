; PlatformIO Project Configuration File
;
; Sumber firmware tunggal: firmware/mesin_cuci_otomatis/
; Folder yang sama dibuka Arduino IDE untuk flash ke ESP32.
; Kredensial: firmware/mesin_cuci_otomatis/secrets.h (lihat secrets.example.h)
;
; Arduino IDE: pilih Tools -> Partition Scheme -> "Minimal SPIFFS (1.9MB APP with OTA)"
; dan install library: ArduinoJson (v7), ESPAsyncWebServer (mathieucarbou), AsyncTCP (mathieucarbou), WebSockets (Links2004).

[platformio]
src_dir = firmware/mesin_cuci_otomatis

[env:rymcu-esp32-devkitc]
platform = espressif32
board = rymcu-esp32-devkitc
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_ignore = WebServer
build_flags = -I firmware/mesin_cuci_otomatis
    -DWEBSOCKETS_TCP_TIMEOUT=15000
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    links2004/WebSockets @ ^2.7.3

; Simulasi Wokwi: WiFi virtual Wokwi-GUEST tanpa password.
; TIME_SCALE=60 -> 1 menit proses = 1 detik. Relay push-pull (open-drain
; tidak tersimulasi dengan baik di Wokwi).
[env:wokwi]
extends = env:rymcu-esp32-devkitc
build_flags =
    ${env:rymcu-esp32-devkitc.build_flags}
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DTIME_SCALE=60
    -DRELAY_OPEN_DRAIN=0
