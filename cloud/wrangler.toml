name = "mesin-cuci-remote"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true      # alamat https://<nama>.<subdomain>.workers.dev
preview_urls = false    # tanpa URL pratinjau tambahan

# UI jarak jauh (hasil: python tools/build_web.py --remote)
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[vars]
# Menit tanpa kabar dari mesin sebelum alarm "mesin tidak terhubung" dikirim ke Telegram
OFFLINE_MIN = "5"
# Batas tunggu balasan mesin untuk satu permintaan (milidetik)
RPC_TIMEOUT_MS = "8000"
